name: readiness

# Self-owned external READINESS monitor: "can the app reach Postgres (Neon)?".
# Probes /api/health?deep=1, which runs SELECT 1 and returns 503 when the DB
# is unreachable.
#
# Cadence is deliberately SLOW (hourly, not every 5 min like liveness).
# Each deep probe wakes Neon, and Neon autosuspends after ~5 min idle, so this
# probe's cost is (wakes/day x suspend timeout), independent of how fast the
# query itself is.
#
# Relaxed 30min -> hourly on 2026-08-02. At */30 this was the single largest
# scheduled waker of the database: 48 wakes/day ~= 4 h/day awake ~= 30 CU-hrs
# per month against a 100 CU-hr free-tier allowance. Hourly halves that. The
# free plan has far less headroom than it appears — the 2026-07-21 outage
# consumed the whole month's allowance and the app was still locked out
# 12 days later, since a spent quota is not refunded by reducing usage.
#
# A DB outage is still caught within the hour, and app-level liveness
# (uptime.yml, every 5 min, no DB) still catches app outages fast. On a paid
# plan, tighten back to */30 or */15 for faster DB-outage detection.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: # allow a manual "is the DB reachable?" run

permissions:
  contents: read

concurrency:
  group: readiness
  cancel-in-progress: true

jobs:
  readiness:
    name: Probe /api/health (readiness / DB)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Override by setting an Actions *variable* named READINESS_URL.
      # Must include ?deep=1 so the endpoint actually runs the DB check.
      READINESS_URL: ${{ vars.READINESS_URL || 'https://njangionchain.com/api/health?deep=1' }}
    steps:
      - name: Probe health endpoint (readiness)
        id: probe
        run: |
          set -euo pipefail
          echo "Probing $READINESS_URL"
          # Retry transient blips (Neon cold start can take a few seconds) so a
          # single slow wake doesn't page. 3 attempts, 10s apart.
          attempt=0
          max=3
          while :; do
            attempt=$((attempt+1))
            code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' --max-time 20 "$READINESS_URL" || echo "000")
            body=$(cat /tmp/ready.json 2>/dev/null || echo '')
            echo "attempt $attempt → HTTP $code | $body"
            # Readiness pass requires HTTP 200 + status:"ok" (deep mode only
            # returns status:"ok" when the DB answered SELECT 1).
            if [ "$code" = "200" ] \
               && printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "✅ database reachable"
              exit 0
            fi
            if [ "$attempt" -ge "$max" ]; then
              {
                echo "ready=false"
                echo "code=$code"
                echo "body=$body"
              } >> "$GITHUB_OUTPUT"
              echo "::error::Readiness (DB) check FAILED after $max attempts (last HTTP $code)"
              exit 1
            fi
            sleep 10
          done

      - name: Alert webhook (optional)
        if: failure()
        env:
          WEBHOOK: ${{ secrets.UPTIME_ALERT_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "UPTIME_ALERT_WEBHOOK not set — relying on GitHub's failed-run email."
            exit 0
          fi
          msg="🟠 njangi-on-chain DB UNREACHABLE — $READINESS_URL readiness check failed (run ${{ github.run_id }})"
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"$msg\",\"content\":\"$msg\"}" \
            "$WEBHOOK" || echo "webhook post failed (non-fatal)"
