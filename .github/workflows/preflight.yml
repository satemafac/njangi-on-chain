name: preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    name: Move build + TypeScript + ESLint + manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Keep in lockstep with package.json "engines.node" — that field is
          # what Vercel uses for the serverless runtime, so CI must test the
          # same major or the pipeline validates a different Node than prod.
          node-version: 24.x
          cache: npm

      - name: Cache Sui CLI
        id: sui-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/sui
          key: sui-cli-${{ runner.os }}-${{ hashFiles('move/Move.toml') }}
          restore-keys: |
            sui-cli-${{ runner.os }}-

      - name: Install Sui CLI
        if: steps.sui-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          mkdir -p "$HOME/.local/bin"
          TGZ=/tmp/sui.tgz

          # Pinned Sui release for reproducible Move builds. Bump intentionally
          # when the Move toolchain updates. MystenLabs PRUNES old releases, so
          # if the pinned tag is gone we self-heal to the latest hosted mainnet
          # release rather than hard-failing every merge (the pinned
          # mainnet-v1.49.0 was pruned, which broke this job for weeks).
          SUI_VERSION="mainnet-v1.75.2"
          URL="https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/sui-${SUI_VERSION}-ubuntu-x86_64.tgz"

          # The release tarball is ~1 GB, so a transient interruption is the
          # most likely failure — retry with resume, generous timeout, and a
          # gzip integrity check before trusting the file.
          download() {
            curl -L --fail --show-error --retry 5 --retry-delay 5 --retry-all-errors \
              --connect-timeout 30 --max-time 600 -C - "$1" -o "$TGZ"
          }

          rm -f "$TGZ"
          if ! download "$URL" || ! gzip -t "$TGZ" 2>/dev/null; then
            echo "::warning::Pinned ${SUI_VERSION} download failed or was pruned — resolving latest hosted mainnet release"
            rm -f "$TGZ"
            URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/MystenLabs/sui/releases?per_page=40" \
              | jq -r '[.[] | select(.tag_name|startswith("mainnet-")) | .assets[] | select(.name|endswith("ubuntu-x86_64.tgz")) | .browser_download_url][0]')
            test -n "$URL" && test "$URL" != "null"
            echo "Falling back to $URL"
            download "$URL"
            gzip -t "$TGZ"
          fi

          echo "Downloaded $(du -h "$TGZ" | cut -f1); free disk:"; df -h /tmp | tail -1
          # Extract just the `sui` binary → $HOME/.local/bin/sui. The archive
          # stores it as `./sui`; GNU tar strips the leading `./`, but try both
          # member spellings so a stricter tar can't silently no-op.
          tar -xzf "$TGZ" -C "$HOME/.local/bin" sui \
            || tar -xzf "$TGZ" -C "$HOME/.local/bin" ./sui
          chmod +x "$HOME/.local/bin/sui"
          # Fail loudly HERE (with a clear message) if the binary isn't usable,
          # rather than letting a later step fail cryptically.
          "$HOME/.local/bin/sui" --version

      - name: Add sui to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run preflight
        run: npm run preflight
        env:
          # The preflight doesn't touch real networks; provide minimal
          # placeholders so validate:env-style checks don't complain if
          # the script is extended to require them.
          NEXT_PUBLIC_SUI_NETWORK: testnet
          NEXT_PUBLIC_TESTNET_PACKAGE_ID: '0x0'
          NEXT_PUBLIC_MAINNET_PACKAGE_ID: '0x0'

      # Gate merges on the Jest suite too (the GTM review flagged that CI ran
      # build/tsc/lint but never the 620-test suite). ~2s, no network needed.
      - name: Run tests
        run: npm test
        env:
          NEXT_PUBLIC_SUI_NETWORK: testnet
          NEXT_PUBLIC_TESTNET_PACKAGE_ID: '0x0'
          NEXT_PUBLIC_MAINNET_PACKAGE_ID: '0x0'
