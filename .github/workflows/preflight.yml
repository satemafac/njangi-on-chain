name: preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    name: Move build + TypeScript + ESLint + manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Keep in lockstep with package.json "engines.node" — that field is
          # what Vercel uses for the serverless runtime, so CI must test the
          # same major or the pipeline validates a different Node than prod.
          node-version: 24.x
          cache: npm

      - name: Cache Sui CLI
        id: sui-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/sui
          key: sui-cli-${{ runner.os }}-${{ hashFiles('move/Move.toml') }}
          restore-keys: |
            sui-cli-${{ runner.os }}-

      - name: Install Sui CLI
        if: steps.sui-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"
          # Pinned Sui release for reproducible Move builds. Bump intentionally
          # when the Move toolchain updates. MystenLabs PRUNES old releases, so
          # if the pinned tag has been removed we self-heal to the latest hosted
          # mainnet release rather than hard-failing every merge (the pinned
          # mainnet-v1.49.0 was pruned, which broke this job for weeks).
          SUI_VERSION="mainnet-v1.75.2"
          URL="https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/sui-${SUI_VERSION}-ubuntu-x86_64.tgz"
          if ! curl -L --fail --silent --show-error "$URL" -o /tmp/sui.tgz; then
            echo "::warning::Pinned ${SUI_VERSION} unavailable (likely pruned) — resolving latest hosted mainnet release"
            URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/MystenLabs/sui/releases?per_page=40" \
              | jq -r '[.[] | select(.tag_name|startswith("mainnet-")) | .assets[] | select(.name|endswith("ubuntu-x86_64.tgz")) | .browser_download_url][0]')
            test -n "$URL" && test "$URL" != "null"
            echo "Falling back to $URL"
            curl -L --fail "$URL" -o /tmp/sui.tgz
          fi
          tar -xzf /tmp/sui.tgz -C "$HOME/.local/bin" sui
          chmod +x "$HOME/.local/bin/sui"

      - name: Add sui to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run preflight
        run: npm run preflight
        env:
          # The preflight doesn't touch real networks; provide minimal
          # placeholders so validate:env-style checks don't complain if
          # the script is extended to require them.
          NEXT_PUBLIC_SUI_NETWORK: testnet
          NEXT_PUBLIC_TESTNET_PACKAGE_ID: '0x0'
          NEXT_PUBLIC_MAINNET_PACKAGE_ID: '0x0'

      # Gate merges on the Jest suite too (the GTM review flagged that CI ran
      # build/tsc/lint but never the 620-test suite). ~2s, no network needed.
      - name: Run tests
        run: npm test
        env:
          NEXT_PUBLIC_SUI_NETWORK: testnet
          NEXT_PUBLIC_TESTNET_PACKAGE_ID: '0x0'
          NEXT_PUBLIC_MAINNET_PACKAGE_ID: '0x0'
