<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Douala market plate</title>
<style>
  /* Scene 6 plate for Circles of the World Ep. 1 (Douala, Cameroon).
     A painterly illustration, deliberately NOT a photo: a synthetic
     photograph of a "real" market would read as documentary evidence.
     No people, no hands, no faces (project rule for generated imagery).
     Rendered once to PNG by build-circles-episode.py at 1296x2304 so the
     Reel can push in on it without softening. Replace with a consented,
     licensed photograph any time; the template only needs plate.png. */
  html, body { margin:0; background:#000; }
  .frame { width:1296px; height:2304px; position:relative; overflow:hidden; }
  svg { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<div class="frame">
<svg id="s" viewBox="0 0 1296 2304" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0805"/>
      <stop offset=".22" stop-color="#26150a"/>
      <stop offset=".40" stop-color="#5e3212"/>
      <stop offset=".47" stop-color="#9b5a1d"/>
      <stop offset=".53" stop-color="#6a3a15"/>
      <stop offset=".64" stop-color="#2a180c"/>
      <stop offset="1" stop-color="#0b0705"/>
    </linearGradient>
    <radialGradient id="sun" cx=".56" cy=".46" r=".46">
      <stop offset="0" stop-color="#ffd996" stop-opacity=".85"/>
      <stop offset=".22" stop-color="#f2ac52" stop-opacity=".45"/>
      <stop offset=".6" stop-color="#c8762a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#c8762a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="wax" width="138" height="138" patternUnits="userSpaceOnUse" patternTransform="rotate(-3)">
      <rect width="138" height="138" fill="#1b2650"/>
      <circle cx="69" cy="69" r="55" fill="none" stroke="#d9a441" stroke-width="11"/>
      <circle cx="69" cy="69" r="37" fill="#b44e27"/>
      <circle cx="69" cy="69" r="22" fill="none" stroke="#f0e2c4" stroke-width="7"/>
      <circle cx="69" cy="69" r="8" fill="#d9a441"/>
      <circle cx="0" cy="0" r="15" fill="#2e776b"/><circle cx="138" cy="0" r="15" fill="#2e776b"/>
      <circle cx="0" cy="138" r="15" fill="#2e776b"/><circle cx="138" cy="138" r="15" fill="#2e776b"/>
      <circle cx="0" cy="0" r="6" fill="#f0e2c4"/><circle cx="138" cy="0" r="6" fill="#f0e2c4"/>
      <circle cx="0" cy="138" r="6" fill="#f0e2c4"/><circle cx="138" cy="138" r="6" fill="#f0e2c4"/>
    </pattern>
    <pattern id="wax2" width="96" height="96" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <rect width="96" height="96" fill="#7d2a1c"/>
      <path d="M0 48 L48 0 L96 48 L48 96 Z" fill="#e0a53f"/>
      <path d="M24 48 L48 24 L72 48 L48 72 Z" fill="#1f5a52"/>
      <circle cx="48" cy="48" r="8" fill="#f0e2c4"/>
    </pattern>
    <pattern id="weave" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="22" fill="#8a5a2b"/>
      <rect width="11" height="22" fill="#a8733a"/>
      <rect y="0" width="22" height="3" fill="#5a3818" opacity=".55"/>
    </pattern>
    <linearGradient id="canopyShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#000" stop-opacity=".05"/>
      <stop offset="1" stop-color="#000" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4222"/>
      <stop offset=".25" stop-color="#4c2d15"/>
      <stop offset="1" stop-color="#241409"/>
    </linearGradient>
    <linearGradient id="tabletop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a30"/>
      <stop offset="1" stop-color="#5c371a"/>
    </linearGradient>
    <radialGradient id="tom" cx=".36" cy=".32" r=".75">
      <stop offset="0" stop-color="#ff8d6a"/>
      <stop offset=".45" stop-color="#e03a22"/>
      <stop offset="1" stop-color="#6e120a"/>
    </radialGradient>
    <radialGradient id="orng" cx=".36" cy=".32" r=".75">
      <stop offset="0" stop-color="#ffe09a"/>
      <stop offset=".45" stop-color="#f29422"/>
      <stop offset="1" stop-color="#8a4306"/>
    </radialGradient>
    <radialGradient id="onion" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#f3b3c4"/>
      <stop offset=".5" stop-color="#a8405e"/>
      <stop offset="1" stop-color="#4d1426"/>
    </radialGradient>
    <linearGradient id="enamel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c2c8"/>
      <stop offset=".35" stop-color="#f4f1ea"/>
      <stop offset="1" stop-color="#8f979d"/>
    </linearGradient>
    <radialGradient id="bulb" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff4d0"/>
      <stop offset=".35" stop-color="#ffd27a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".47" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".7"/>
    </radialGradient>
    <filter id="paint" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .38  0 0 0 .5 -.14"/>
    </filter>
    <filter id="strokes" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".0028 .05" numOctaves="3" seed="11" result="s"/>
      <feColorMatrix in="s" type="matrix" values="0 0 0 0 .95  0 0 0 0 .78  0 0 0 0 .5  0 0 0 .9 -.42"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="glowb" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <g filter="url(#paint)">
    <rect width="1296" height="2304" fill="url(#sky)"/>
    <rect width="1296" height="2304" fill="url(#sun)"/>

    <!-- distant market: rooflines and umbrellas against the low sun -->
    <g id="far" fill="#1c1009" opacity=".9"></g>
    <rect x="0" y="1140" width="1296" height="1164" fill="#130b06" opacity=".72"/>

    <!-- side cloth hanging from the frame (left) -->
    <path d="M40 560 C 60 800, 30 1050, 70 1290 L 190 1300 C 170 1060, 190 820, 170 560 Z" fill="url(#wax2)"/>
    <path d="M40 560 C 60 800, 30 1050, 70 1290 L 190 1300 C 170 1060, 190 820, 170 560 Z" fill="#000" opacity=".35"/>

    <!-- poles -->
    <rect x="196" y="720" width="22" height="1180" fill="#2b190c"/>
    <rect x="1080" y="720" width="22" height="1180" fill="#2b190c"/>
    <rect x="200" y="720" width="5" height="1180" fill="#6b4524" opacity=".55"/>
    <rect x="1084" y="720" width="5" height="1180" fill="#6b4524" opacity=".55"/>

    <!-- canopy: wax print, the circle motif hiding in plain sight -->
    <path id="canopy" d="M60 560 Q 648 488 1236 560 L 1216 836 Q 648 792 80 836 Z" fill="url(#wax)"/>
    <path d="M60 560 Q 648 488 1236 560 L 1216 836 Q 648 792 80 836 Z" fill="url(#canopyShade)"/>
    <g id="scallops"></g>

    <!-- hanging bulbs -->
    <g id="bulbs"></g>

    <!-- table -->
    <path d="M110 1318 L 1186 1318 L 1250 1392 L 46 1392 Z" fill="url(#tabletop)"/>
    <rect x="46" y="1392" width="1204" height="250" fill="url(#wood)"/>
    <g id="planks" stroke="#1d1007" stroke-width="3" opacity=".6"></g>
    <!-- cloth draped over the table front -->
    <path id="drape" fill="url(#wax2)"/>
    <path id="drapeShade" fill="#000" opacity=".28"/>

    <!-- produce -->
    <g id="produce"></g>

    <!-- basket, foreground left -->
    <g transform="translate(150 1560)">
      <path d="M -120 0 L 120 0 L 96 170 L -96 170 Z" fill="url(#weave)"/>
      <path d="M -120 0 L 120 0 L 96 170 L -96 170 Z" fill="#000" opacity=".25"/>
      <ellipse cx="0" cy="0" rx="120" ry="30" fill="#5a3818"/>
      <g id="basketFruit"></g>
    </g>
  </g>

  <!-- painterly finish: long brush streaks, grain, bokeh, vignette -->
  <rect width="1296" height="2304" filter="url(#strokes)" opacity=".22" style="mix-blend-mode:soft-light"/>
  <rect width="1296" height="2304" filter="url(#grain)" opacity=".5" style="mix-blend-mode:overlay"/>
  <g id="bokeh" filter="url(#soft)"></g>
  <rect width="1296" height="2304" fill="url(#vig)"/>
</svg>
</div>
<script>
  // Deterministic generator (fixed seed) for the repetitive parts.
  const NS = 'http://www.w3.org/2000/svg';
  let seed = 20250653;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const $ = (id) => document.getElementById(id);

  // distant rooflines + umbrellas
  const far = $('far');
  mk('path', { d: 'M0 1150 L0 1030 L90 1030 L90 1000 L250 990 L260 1040 L380 1040 L390 1010 L520 1020 L530 1060 L700 1060 L710 1025 L860 1020 L870 1050 L1010 1045 L1020 1000 L1180 1005 L1190 1040 L1296 1040 L1296 1150 Z' }, far);
  [[150, 1060, 120], [420, 1075, 150], [760, 1070, 140], [1040, 1062, 130], [1230, 1080, 110]].forEach(([x, y, w]) => {
    mk('path', { d: `M${x - w} ${y} Q ${x} ${y - w * 0.8} ${x + w} ${y} Z` }, far);
    mk('rect', { x: x - 3, y, width: 6, height: 90 }, far);
  });

  // scalloped canopy hem
  const sc = $('scallops');
  for (let x = 92; x <= 1206; x += 44) {
    const t = (x - 80) / (1216 - 80);
    const yy = 836 - (1 - Math.pow(2 * t - 1, 2)) * 44 + 4;   // follows the canopy's curved hem
    mk('circle', { cx: x, cy: yy, r: 23, fill: '#b44e27' }, sc);
    mk('circle', { cx: x, cy: yy + 3, r: 9, fill: '#d9a441' }, sc);
  }

  // bulbs on cords
  const bl = $('bulbs');
  [[330, 930], [560, 968], [790, 948], [1000, 912]].forEach(([x, y]) => {
    mk('line', { x1: x, y1: 800, x2: x, y2: y - 14, stroke: '#1a0f07', 'stroke-width': 3 }, bl);
    mk('circle', { cx: x, cy: y, r: 70, fill: 'url(#bulb)', opacity: .55, filter: 'url(#glowb)' }, bl);
    mk('circle', { cx: x, cy: y, r: 15, fill: '#fff1c4' }, bl);
  });

  // planks
  const pk = $('planks');
  for (let x = 150; x < 1250; x += 150 + Math.round(rnd() * 40)) mk('line', { x1: x, y1: 1392, x2: x + 6, y2: 1642 }, pk);

  // drape with a scalloped hem across the table front
  let d = 'M 46 1392 L 1250 1392 L 1250 1500 ';
  for (let x = 1250; x > 46; x -= 60) d += `Q ${x - 30} ${1560 + (rnd() * 10)} ${x - 60} 1500 `;
  d += 'Z';
  $('drape').setAttribute('d', d);
  $('drapeShade').setAttribute('d', d);

  // produce: pyramids of tomatoes, onions, oranges; an enamel basin of peppers
  const pr = $('produce');
  const pyramid = (cx, base, r, fill, rows) => {
    for (let row = 0; row < rows; row++) {
      const n = rows - row, y = base - r - row * r * 1.62;
      for (let k = 0; k < n; k++) {
        const x = cx + (k - (n - 1) / 2) * r * 1.9 + (rnd() - 0.5) * 3;
        mk('circle', { cx: x, cy: y, r: r * (0.95 + rnd() * 0.08), fill, stroke: '#2a0a05', 'stroke-width': 2, 'stroke-opacity': .35 }, pr);
        mk('ellipse', { cx: x - r * 0.3, cy: y - r * 0.35, rx: r * 0.26, ry: r * 0.16, fill: '#fff', opacity: .38 }, pr);
      }
    }
  };
  pyramid(360, 1336, 30, 'url(#tom)', 4);
  pyramid(360 + 250, 1336, 27, 'url(#onion)', 3);
  pyramid(1000, 1336, 30, 'url(#orng)', 4);
  // enamel basin with peppers
  const bx = 800, by = 1300;
  mk('path', { d: `M ${bx - 96} ${by} L ${bx + 96} ${by} L ${bx + 70} ${by + 44} L ${bx - 70} ${by + 44} Z`, fill: 'url(#enamel)' }, pr);
  // a domed heap of peppers, drawn back to front so the dome reads
  for (let i = 0; i < 70; i++) {
    const u = rnd() * 2 - 1, x = bx + u * 88;
    const top = 58 * Math.sqrt(Math.max(0, 1 - u * u));
    const y = by - 4 - rnd() * top;
    const hot = rnd() > 0.28;
    mk('ellipse', { cx: x, cy: y, rx: 13, ry: 8, fill: hot ? (rnd() > .5 ? '#d32a1c' : '#a81a12') : '#3c8a34', stroke: '#300806', 'stroke-width': 1.2, 'stroke-opacity': .4, transform: `rotate(${(rnd() - 0.5) * 80} ${x} ${y})` }, pr);
  }
  mk('ellipse', { cx: bx, cy: by, rx: 98, ry: 13, fill: 'none', stroke: '#1d4f8a', 'stroke-width': 7 }, pr);
  mk('ellipse', { cx: bx, cy: by, rx: 98, ry: 13, fill: 'none', stroke: '#c9241a', 'stroke-width': 2.5 }, pr);

  // basket: a heaped mound of garden eggs (small white and green aubergines)
  const bf = $('basketFruit');
  for (let row = 0; row < 4; row++) {
    const n = 7 - row, y = -10 - row * 26;
    for (let k = 0; k < n; k++) {
      const x = (k - (n - 1) / 2) * 30 + (rnd() - 0.5) * 6;
      const green = rnd() > 0.55;
      mk('ellipse', { cx: x, cy: y, rx: 17, ry: 15, fill: green ? '#6f9a3e' : '#efe6c8', stroke: '#2a2410', 'stroke-width': 1.5, 'stroke-opacity': .4 }, bf);
      mk('ellipse', { cx: x - 5, cy: y - 5, rx: 5, ry: 3, fill: '#fff', opacity: .45 }, bf);
      mk('path', { d: `M ${x - 6} ${y - 13} Q ${x} ${y - 20} ${x + 6} ${y - 13}`, fill: 'none', stroke: '#3f6b24', 'stroke-width': 4 }, bf);
    }
  }

  // foreground bokeh
  const bk = $('bokeh');
  [[120, 520, 90, .22], [1180, 640, 120, .18], [1150, 1980, 150, .2], [180, 2060, 130, .16], [640, 2150, 90, .12], [980, 460, 60, .14]].forEach(([x, y, r, o]) =>
    mk('circle', { cx: x, cy: y, r, fill: '#ffc46b', opacity: o }, bk));
</script>
</body>
</html>
