<title>Nobody Holds the Pot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Njangi On-Chain — social loop asset.
     Single-theme by intent: this is exported to GIF/MP4 where appearance is
     fixed, and the brand ground is dark. Every colour is painted explicitly
     so the frame never borrows a host background. Tokens mirror
     tailwind.config.ts exactly — this is the product's system, not a new one. */
  :root {
    --ink:        #0a0a0c;
    --ink-deep:   #0d0c12;
    --ink-surface:#13121a;
    --ink-border: #2a2620;
    --gold:       #E8B04B;
    --gold-hi:    #f6d99a;
    --gold-deep:  #C8902F;
    --cream:      #f5f1e8;
    --sand:       #a8a294;
    --sand-dim:   #8b8578;
    --loop: 7s;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--cream);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    display: grid;
    place-items: center;
    min-height: 100dvh;
    padding: 24px;
  }

  /* The export frame. 1080x1080 works on X, LinkedIn and Instagram.
     Scales down to fit the preview without changing composition. */
  .frame {
    width: min(1080px, 92vmin);
    aspect-ratio: 1;
    background:
      radial-gradient(120% 90% at 50% 8%, #14121b 0%, var(--ink-deep) 55%, var(--ink) 100%);
    border: 1px solid var(--ink-border);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr auto;
    container-type: inline-size;
  }

  header { padding: 7cqw 7cqw 0; }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 1.55cqw;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 2.4cqw;
  }
  h1 {
    font-size: 7.4cqw;
    line-height: 0.98;
    letter-spacing: -0.035em;
    font-weight: 600;
    margin: 0;
    color: var(--cream);
    text-wrap: balance;
  }
  h1 em {
    font-style: normal;
    color: var(--gold);
  }
  .sub {
    margin: 2.6cqw 0 0;
    font-size: 2.15cqw;
    line-height: 1.5;
    color: var(--sand);
    max-width: 58ch;
  }

  .stage { display: grid; place-items: center; }
  /* 74cqw overflowed the square frame: header 378 + svg 799 + footer 94 =
     1271 in a 1080 box, so the lower members and the footer were being
     clipped by overflow:hidden at every size. 52cqw fits with air. */
  svg { width: 52cqw; height: 52cqw; overflow: visible; }

  footer {
    padding: 0 7cqw 6.5cqw;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 4cqw;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 1.7cqw;
    color: var(--sand-dim);
    letter-spacing: 0.04em;
  }
  footer .mark { color: var(--cream); letter-spacing: 0.14em; text-transform: uppercase; }

  /* ---- diagram ---- */
  .ring-track { fill: none; stroke: var(--ink-border); stroke-width: 2; }

  /* Escrow ring fills as contributions land, then empties on payout. */
  .ring-fill {
    fill: none;
    stroke: var(--gold);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 880;
    stroke-dashoffset: 880;
    transform: rotate(-90deg);
    transform-origin: 540px 540px;
    animation: fill var(--loop) linear infinite;
  }
  /* Steps in, one sixth per arriving contribution — the ring must not glide
     while the counter jumps, or the two tell different stories. Drains
     smoothly on payout, because that IS one continuous movement. */
  @keyframes fill {
    0%,    8.5%  { stroke-dashoffset: 880; }
    8.6%, 15.6%  { stroke-dashoffset: 733; }
    15.7%, 22.8% { stroke-dashoffset: 587; }
    22.9%, 29.9% { stroke-dashoffset: 440; }
    30%,  37.0%  { stroke-dashoffset: 293; }
    37.1%, 44.2% { stroke-dashoffset: 147; }
    44.3%, 60%   { stroke-dashoffset: 0; }
    78%, 100%    { stroke-dashoffset: 880; }
  }

  .member { fill: var(--ink-surface); stroke: var(--ink-border); stroke-width: 2; }
  .member-label {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 26px;
    fill: var(--sand-dim);
    text-anchor: middle;
    dominant-baseline: central;
  }

  /* Exactly one member is this cycle's recipient. */
  .recipient .member {
    animation: lift var(--loop) ease-in-out infinite;
  }
  .recipient .member-label { fill: var(--gold-hi); }
  @keyframes lift {
    0%, 44%   { fill: var(--ink-surface); stroke: var(--ink-border); }
    50%, 80%  { fill: #241c0c;            stroke: var(--gold); }
    92%, 100% { fill: var(--ink-surface); stroke: var(--ink-border); }
  }

  /* Contributions travel inward. */
  .contrib { fill: var(--gold); opacity: 0; }
  .contrib { animation: contribute var(--loop) ease-in infinite; }
  @keyframes contribute {
    0%        { transform: translate(0,0); opacity: 0; }
    1%        { opacity: 1; }
    7.1%      { transform: var(--to-centre); opacity: 1; }
    8.5%, 100%{ transform: var(--to-centre); opacity: 0; }
  }

  /* The pot travels out to the scheduled member — never to a middle party. */
  .payout {
    fill: var(--gold-hi);
    opacity: 0;
    animation: payout var(--loop) cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes payout {
    0%, 58%   { transform: translate(0,0); opacity: 0; }
    60%       { transform: translate(0,0); opacity: 1; }
    76%       { transform: var(--to-recipient); opacity: 1; }
    82%, 100% { transform: var(--to-recipient); opacity: 0; }
  }

  /* The centre deliberately holds no company mark. The gap is the argument. */
  .escrow-well { fill: none; stroke: var(--ink-border); stroke-width: 2; stroke-dasharray: 6 10; }
  .escrow-cap {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 24px;
    fill: var(--sand-dim);
    text-anchor: middle;
    letter-spacing: 0.16em;
  }
  /* CSS cannot animate text content, so each count is its own node and only
     one is visible at a time. steps(1) keeps the change instant — a fade
     would read as uncertainty about how much is in the pot. */
  .escrow-amt {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 46px;
    font-weight: 500;
    fill: var(--cream);
    text-anchor: middle;
    font-variant-numeric: tabular-nums;
    opacity: 0;
    animation-duration: var(--loop);
    animation-timing-function: steps(1);
    animation-iteration-count: infinite;
  }
  .amt-0 { animation-name: amt0; fill: var(--sand-dim); }
  .amt-1 { animation-name: amt1; }
  .amt-2 { animation-name: amt2; }
  .amt-3 { animation-name: amt3; }
  .amt-4 { animation-name: amt4; }
  .amt-5 { animation-name: amt5; }
  .amt-6 { animation-name: amt6; fill: var(--gold-hi); }

  @keyframes amt0 { 0%,8.5%{opacity:1} 8.6%,77.9%{opacity:0} 78%,100%{opacity:1} }
  @keyframes amt1 { 0%,8.5%{opacity:0} 8.6%,15.6%{opacity:1} 15.7%,100%{opacity:0} }
  @keyframes amt2 { 0%,15.6%{opacity:0} 15.7%,22.8%{opacity:1} 22.9%,100%{opacity:0} }
  @keyframes amt3 { 0%,22.8%{opacity:0} 22.9%,29.9%{opacity:1} 30%,100%{opacity:0} }
  @keyframes amt4 { 0%,29.9%{opacity:0} 30%,37.0%{opacity:1} 37.1%,100%{opacity:0} }
  @keyframes amt5 { 0%,37.0%{opacity:0} 37.1%,44.2%{opacity:1} 44.3%,100%{opacity:0} }
  @keyframes amt6 { 0%,44.2%{opacity:0} 44.3%,77.9%{opacity:1} 78%,100%{opacity:0} }

  @media (prefers-reduced-motion: reduce) {
    .ring-fill, .contrib, .payout, .escrow-amt, .recipient .member { animation: none; }
    .ring-fill { stroke-dashoffset: 0; }
    .escrow-amt { opacity: 0; }
    .amt-6 { opacity: 1; }
    .contrib, .payout { opacity: 0; }
    .recipient .member { fill: #241c0c; stroke: var(--gold); }
  }
</style>

<div class="frame">
  <header>
    <p class="eyebrow">How a cycle works</p>
    <h1>Nobody holds the pot.<br><em>Not even us.</em></h1>
    <p class="sub">Everyone pays in. One member takes the whole pot, on a schedule the group agreed. The money never passes through a company in the middle.</p>
  </header>

  <div class="stage">
    <svg viewBox="0 0 1080 1080" role="img"
         aria-label="Six members on a ring pay into a shared pot. The full pot then moves to one scheduled member. Nothing passes through a company in the middle.">
      <circle class="ring-track" cx="540" cy="540" r="140"></circle>
      <circle class="ring-fill"  cx="540" cy="540" r="140"></circle>

      <circle class="escrow-well" cx="540" cy="540" r="96"></circle>
      <text class="escrow-cap" x="540" y="516">THE POT</text>
      <text class="escrow-amt amt-0" x="540" y="574">0 / 6</text>
      <text class="escrow-amt amt-1" x="540" y="574">1 / 6</text>
      <text class="escrow-amt amt-2" x="540" y="574">2 / 6</text>
      <text class="escrow-amt amt-3" x="540" y="574">3 / 6</text>
      <text class="escrow-amt amt-4" x="540" y="574">4 / 6</text>
      <text class="escrow-amt amt-5" x="540" y="574">5 / 6</text>
      <text class="escrow-amt amt-6" x="540" y="574">6 / 6</text>

      <!-- Six members. Ring radius 360, centre 540,540. -->
      <g class="node"                style="--to-centre: translate(0px, -360px);   --to-recipient: translate(0px, -360px);">
        <g transform="translate(540,180)"><circle class="member" r="52"></circle><text class="member-label" y="2">1</text></g>
      </g>
      <g class="node recipient"      style="--to-centre: translate(-312px,-180px); --to-recipient: translate(312px, 180px);">
        <g transform="translate(852,360)"><circle class="member" r="52"></circle><text class="member-label" y="2">2</text></g>
      </g>
      <g class="node"                style="--to-centre: translate(-312px, 180px);">
        <g transform="translate(852,720)"><circle class="member" r="52"></circle><text class="member-label" y="2">3</text></g>
      </g>
      <g class="node"                style="--to-centre: translate(0px, 360px);">
        <g transform="translate(540,900)"><circle class="member" r="52"></circle><text class="member-label" y="2">4</text></g>
      </g>
      <g class="node"                style="--to-centre: translate(312px, 180px);">
        <g transform="translate(228,720)"><circle class="member" r="52"></circle><text class="member-label" y="2">5</text></g>
      </g>
      <g class="node"                style="--to-centre: translate(312px,-180px);">
        <g transform="translate(228,360)"><circle class="member" r="52"></circle><text class="member-label" y="2">6</text></g>
      </g>

      <!-- Contributions inward. Staggered so the ring fills member by member. -->
      <circle class="contrib" r="13" cx="540" cy="180" style="--to-centre: translate(0px,   300px);  animation-delay: .1s"></circle>
      <circle class="contrib" r="13" cx="852" cy="360" style="--to-centre: translate(-260px,150px);  animation-delay: .6s"></circle>
      <circle class="contrib" r="13" cx="852" cy="720" style="--to-centre: translate(-260px,-150px); animation-delay: 1.1s"></circle>
      <circle class="contrib" r="13" cx="540" cy="900" style="--to-centre: translate(0px,  -300px);  animation-delay: 1.6s"></circle>
      <circle class="contrib" r="13" cx="228" cy="720" style="--to-centre: translate(260px,-150px);  animation-delay: 2.1s"></circle>
      <circle class="contrib" r="13" cx="228" cy="360" style="--to-centre: translate(260px, 150px);  animation-delay: 2.6s"></circle>

      <!-- The pot leaves the centre for member 2 only. -->
      <circle class="payout" r="22" cx="540" cy="540" style="--to-recipient: translate(312px,-180px);"></circle>
    </svg>
  </div>

  <footer>
    <span class="mark">Njangi On-Chain</span>
    <span>njangionchain.com</span>
  </footer>
</div>
