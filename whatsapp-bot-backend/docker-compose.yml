version: '3.9'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-bot-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: info
      LOG_FILE: logs/app.log
      
      # Sui Blockchain
      NEXT_PUBLIC_TESTNET_RPC_URL: ${NEXT_PUBLIC_TESTNET_RPC_URL}
      NEXT_PUBLIC_MAINNET_RPC_URL: ${NEXT_PUBLIC_MAINNET_RPC_URL}
      NEXT_PUBLIC_TESTNET_RPC_ALT: ${NEXT_PUBLIC_TESTNET_RPC_ALT}
      NEXT_PUBLIC_MAINNET_RPC_ALT: ${NEXT_PUBLIC_MAINNET_RPC_ALT}
      SUI_TESTNET_PACKAGE_ID: ${SUI_TESTNET_PACKAGE_ID}
      SUI_MAINNET_PACKAGE_ID: ${SUI_MAINNET_PACKAGE_ID}
      SUI_DEFAULT_PACKAGE_ID: ${SUI_DEFAULT_PACKAGE_ID}
      SUI_WHATSAPP_LINKS_REGISTRY_ID: ${SUI_WHATSAPP_LINKS_REGISTRY_ID}
      
      # WhatsApp
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID}
      
      # zkLogin / Enoki
      ZKLOGIN_TESTNET_ENOKI_KEY: ${ZKLOGIN_TESTNET_ENOKI_KEY}
      ZKLOGIN_MAINNET_ENOKI_KEY: ${ZKLOGIN_MAINNET_ENOKI_KEY}
      ZKLOGIN_DEFAULT_ENOKI_KEY: ${ZKLOGIN_DEFAULT_ENOKI_KEY}
      ZKLOGIN_ISSUER_URL: ${ZKLOGIN_ISSUER_URL:-https://accounts.google.com}
      ZKLOGIN_REDIRECT_URL: ${ZKLOGIN_REDIRECT_URL:-http://localhost:3000/api/auth/callback}
      
      # OAuth Providers
      ZKLOGIN_GOOGLE_CLIENT_ID: ${ZKLOGIN_GOOGLE_CLIENT_ID}
      ZKLOGIN_GOOGLE_CLIENT_SECRET: ${ZKLOGIN_GOOGLE_CLIENT_SECRET}
      ZKLOGIN_FACEBOOK_CLIENT_ID: ${ZKLOGIN_FACEBOOK_CLIENT_ID}
      ZKLOGIN_FACEBOOK_CLIENT_SECRET: ${ZKLOGIN_FACEBOOK_CLIENT_SECRET}
      ZKLOGIN_APPLE_CLIENT_ID: ${ZKLOGIN_APPLE_CLIENT_ID}
      ZKLOGIN_APPLE_CLIENT_SECRET: ${ZKLOGIN_APPLE_CLIENT_SECRET}
      
      # Feature Flags
      ENABLE_EVENT_LISTENER: 'true'
      ENABLE_MESSAGE_SENDER: 'true'
      ENABLE_ON_CHAIN_LOGGING: 'true'
    
    volumes:
      - ./logs:/app/logs
      - ./src:/app/src:ro
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

# Networks (for future multi-container setup)
networks:
  default:
    name: whatsapp-bot-network
    driver: bridge

# Volumes (persistent logs)
volumes:
  logs:
    driver: local
