[package]
name = "njangi"
version = "0.1.0"
published-at = "0x0"
edition = "2024"

[dependencies]
Sui = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/sui-framework/packages/sui-framework", rev = "041c5f2bae2fe52079e44b70514333532d69f4e6" }
Pyth = { git = "https://github.com/pyth-network/pyth-crosschain.git", subdir = "target_chains/sui/contracts", rev = "sui-contract-testnet" }
# Note: Wormhole is a dependency of Pyth, so we don't need to include it explicitly to avoid conflicts

# CETUS INTEGRATION VIA DIRECT PACKAGE ADDRESSES (No dependency conflicts!)
# Instead of Git dependencies, we'll use direct package addresses from testnet
# This is the standard approach for Move smart contracts and avoids version conflicts
# Source: https://cetus-1.gitbook.io/cetus-developer-docs/developer/dev-overview

