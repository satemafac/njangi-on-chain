[package]
name = "njangi"
version = "0.1.0"
published-at = "0x0"
edition = "2024"

[dependencies]
# Sui/MoveStdlib are implicit system dependencies: the CLI injects the framework
# version matching the installed compiler. Do NOT pin Sui explicitly here — a
# pinned rev that diverges from the local `sui` binary breaks `sui move test`
# (the pinned framework's own test files fail to compile under a mismatched
# compiler). See docs/gtm-readiness-review-2026-06-12.md (toolchain finding).
Pyth = { git = "https://github.com/pyth-network/pyth-crosschain.git", subdir = "target_chains/sui/contracts", rev = "sui-contract-mainnet" }
# Note: Wormhole is a dependency of Pyth, so we don't need to include it explicitly to avoid conflicts

# DYNAMIC NETWORK CONFIGURATION
# This file is dynamically updated by scripts/switch-network.sh
# Current configuration: MAINNET

# CETUS INTEGRATION - MAINNET DEPENDENCIES
# Using official mainnet package addresses (mainnet-v1.49.0) for production protocol integration
# Source: https://cetus-1.gitbook.io/cetus-developer-docs/developer/via-contract

[addresses]
njangi = "0x0"
# The immutable OBJECT id of this lineage's 0x2::package::UpgradeCap,
# created by the mainnet publish of
# 0x7bf5274804a6008ebfbd9bfe766defb7fd5aa5fe6777419c2b6531ec99120b55
# (tx C4EqEKovAo76spPKMGuBNxnc7iz2yPZF76tgpdmka3XX). Object ids never
# change across upgrades or transfers, so njangi_compliance uses this to
# verify a presented UpgradeCap actually governs THIS package lineage —
# any package's cap satisfies `&UpgradeCap` otherwise. Update only if the
# lineage is ever re-published from scratch (fresh `sui client publish`).
njangi_upgrade_cap = "0xd8ca29501b1f1eaee88d37d509e9c80cd5ae45d29acc198137c525aa36e7117c"
# Official Cetus mainnet package addresses (mainnet-v1.49.0)
cetus_clmm = "0x75b2e9ecad34944b8d0c874e568c90db0cf9437f0d7392abfd4cb902972f3e40"
cetus_dca = "0x587614620d0d30aed66d86ffd3ba385a661a86aa573a4d579017068f561c6d8f"
cetus_limit_order = "0xaf524efdc97a0e221db17252ab5feaa3b96234c2819a5baa552190f79e40b6d2"
cetus_lp_burn = "0xf80a6bb02d98cebf90a6476e8c106a4ddf1865ef79d6067a66933eb57b9f0f7b"
cetus_stable_farming = "0x7dba8e74b5d512a3c3bd8a1f7ef111fe9f624ddeb935635385645ca5db1f7850"
cetus_xcetus = "0x07d45ee8fc56ddce3232304c1191f3c0319fa8240305c5ee2231a2da7cbb49e6"
cetus_dividend = "0x5aa58e1623885bd93de2331d05c29bf4930e54e56beeabcab8fe5385de2d31dc"
# Pyth mainnet address
pyth_network = "0x8d97f1cd6ac663735be08d48a218f259dcb83244b6b5b94a999e689b86929519" 